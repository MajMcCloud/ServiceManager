name: CI

on:
  push:
    branches: [ main ]
    # Trigger on tags so a release build takes its version from the tag.
    # The existing tags read "v2.0.1.27", the newest one "2.1.0.0" - both have to work.
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ( .NET Framework 4.8.1 )
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # publish.ps1 writes the release notes from git log <last tag>..HEAD.
          fetch-depth: 0

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Resolve version
        id: version
        run: |
          if ( $env:GITHUB_REF_TYPE -eq 'tag' ) {
            $v = $env:GITHUB_REF_NAME -replace '^[vV]', ''
          } else {
            $v = ( Select-String -Path version.props -Pattern '<SMVersion>([^<]+)</SMVersion>' ).Matches[0].Groups[1].Value
          }

          if ( $v -notmatch '^\d+\.\d+\.\d+\.\d+$' ) {
            Write-Error "Expected four numbers as the version, got: $v"
            exit 1
          }

          "version=$v" >> $env:GITHUB_OUTPUT
          "SM_VERSION=$v" >> $env:GITHUB_ENV

          if ( $env:GITHUB_REF_TYPE -eq 'tag' ) { Write-Host "Version $v from the tag" } else { Write-Host "Version $v from version.props" }

      - name: Restore NuGet packages
        run: msbuild ServiceManager.sln /t:Restore /p:Configuration=Release /p:SMVersion=$env:SM_VERSION /v:minimal /nologo

      - name: Build solution
        run: msbuild ServiceManager.sln /t:Rebuild /p:Configuration=Release /p:SMVersion=$env:SM_VERSION /v:minimal /nologo

      - name: Run tests
        run: dotnet test ServiceManager.Tests/ServiceManager.Tests.csproj -c Release --no-build -v minimal

      # One folder, exactly the way it is installed later: the UI output (already holds
      # ServiceManager.exe) plus extensions\TelegramBotNotifier with Telegram.Bot.dll.
      # publish.ps1 -Strict turns a deviating version of a part into an error.
      - name: Assemble deployment folder
        run: .\publish.ps1 -Version $env:SM_VERSION -SkipBuild -Strict

      - name: Upload deployment folder
        uses: actions/upload-artifact@v4
        with:
          name: ServiceManager-${{ steps.version.outputs.version }}
          path: |
            publish
            ServiceManager-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 14
