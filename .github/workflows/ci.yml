name: CI

on:
  push:
    branches: [ main ]
    # Trigger on tags so a release build takes its version from the tag.
    # The existing tags read "v2.0.1.27", the newest one "2.1.0.0" - both have to work.
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build ( .NET 11 )
    runs-on: windows-latest

    env:
      # The framework dependent package stays the small one, every runtime identifier listed
      # here adds a self contained package that needs no runtime on the target machine.
      RUNTIMES: win-x64,win-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # publish.ps1 writes the release notes from git log <last tag>..HEAD.
          fetch-depth: 0

      - name: Set up the .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Resolve version
        id: version
        run: |
          if ( $env:GITHUB_REF_TYPE -eq 'tag' ) {
            $v = $env:GITHUB_REF_NAME -replace '^[vV]', ''
          } else {
            $v = ( Select-String -Path version.props -Pattern '<SMVersion>([^<]+)</SMVersion>' ).Matches[0].Groups[1].Value
          }

          if ( $v -notmatch '^\d+\.\d+\.\d+\.\d+$' ) {
            Write-Error "Expected four numbers as the version, got: $v"
            exit 1
          }

          "version=$v" >> $env:GITHUB_OUTPUT
          "SM_VERSION=$v" >> $env:GITHUB_ENV

          if ( $env:GITHUB_REF_TYPE -eq 'tag' ) { Write-Host "Version $v from the tag" } else { Write-Host "Version $v from version.props" }

      - name: Restore NuGet packages
        run: dotnet restore ServiceManager.sln -p:SMVersion=$env:SM_VERSION

      - name: Build solution
        run: dotnet build ServiceManager.sln -c Release --no-restore -p:SMVersion=$env:SM_VERSION -v minimal /nologo

      - name: Run tests
        run: dotnet test ServiceManager.Tests/ServiceManager.Tests.csproj -c Release --no-build -v minimal

      # One folder, exactly the way it is installed later: the UI output (already holds
      # ServiceManager.exe) plus extensions\TelegramBotNotifier with Telegram.Bot.dll.
      # On top of that package publish.ps1 builds one self contained ZIP per runtime identifier.
      # -Strict turns a deviating version of a part into an error.
      - name: Assemble the packages
        run: .\publish.ps1 -Version $env:SM_VERSION -Runtime $env:RUNTIMES -SkipBuild -Strict

      - name: Upload deployment folder
        uses: actions/upload-artifact@v4
        with:
          name: ServiceManager-${{ steps.version.outputs.version }}
          path: |
            publish
            ServiceManager-${{ steps.version.outputs.version }}.zip
            ServiceManager-${{ steps.version.outputs.version }}-*.zip
          if-no-files-found: error
          retention-days: 14
